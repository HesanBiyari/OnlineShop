{% extends "base.html" %}
{% block title %}ورود | Giftweb{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="section-heading"><div><span class="section-label">حساب کاربری</span><h1>ورود</h1></div></div>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="product-button" type="submit">ورود</button>
        </form>
        <p class="auth-switch">حساب ندارید؟ <a href="{% url 'signup' %}">ثبت‌نام کنید</a></p>
    </div>
</section>
{% endblock %}
