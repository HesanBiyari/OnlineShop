{% extends "base.html" %}

{% block title %}ورود | Giftweb{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1>ورود به حساب</h1>

        <form method="post">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            {{ form.as_p }}
            <button type="submit" class="product-button">ورود</button>
        </form>

        <p>
            حساب ندارید؟
            <a href="{% url 'signup' %}">ثبت‌نام کنید</a>
        </p>
    </div>
</section>
{% endblock %}
