{% extends 'admin_panel/base.html' %}
{% block title %}تحلیل فروش | Giftbaaz{% endblock %}
{% block content %}
<div class="gw-heading compact">
    <div>
        <span>ابزار مدیریت</span>
        <h1>تحلیل فروش</h1>
        <p>خلاصه درآمد پرداخت‌شده؛ IP درخواست: <span dir="ltr">{{ ip }}</span></p>
    </div>
    <a class="gw-secondary" href="{% url 'admin_dashboard' %}">بازگشت به داشبورد</a>
</div>

<div class="gw-kpis">
    <div><small>درآمد کل</small><strong>{{ revenue|floatformat:0 }}</strong><span>تومان</span></div>
    <div><small>درآمد امروز</small><strong>{{ today|floatformat:0 }}</strong><span>تومان</span></div>
</div>
{% endblock %}
