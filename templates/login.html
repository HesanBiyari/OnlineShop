{% extends "base.html" %}

{% block title %}ورود | Giftweb{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="section-heading centered"><div><span class="section-label">حساب کاربری</span><h1>ورود</h1></div></div>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}
            <button class="product-button" type="submit">ورود</button>
        </form>
        <p style="margin-top:15px;">حساب ندارید؟ <a href="{% url 'signup' %}">ثبت‌نام کنید</a>.</p>
    </div>
</section>
{% endblock %}
