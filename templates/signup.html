{% extends "base.html" %}

{% block title %}ثبت‌نام | Giftweb{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="section-heading centered"><div><span class="section-label">حساب کاربری</span><h1>ثبت‌نام</h1></div></div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="product-button" type="submit">ساخت حساب</button>
        </form>
        <p style="margin-top:15px;">حساب دارید؟ <a href="{% url 'login' %}">وارد شوید</a>.</p>
    </div>
</section>
{% endblock %}
