{% extends "base.html" %}
{% block title %}ثبت‌نام | Giftweb{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="section-heading"><div><span class="section-label">شروع</span><h1>ساخت حساب</h1></div></div>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button class="product-button" type="submit">ثبت‌نام</button>
        </form>
        <p class="auth-switch">حساب دارید؟ <a href="{% url 'login' %}">وارد شوید</a></p>
    </div>
</section>
{% endblock %}
