{% extends "base.html" %}

{% block title %}پرداخت | Giftweb{% endblock %}

{% block content %}
<section class="payment-page">
    <div class="auth-card">
        <div class="section-heading centered"><div><span class="section-label">پرداخت</span><h1>سفارش #{{ order.id }}</h1></div></div>
        <p>مبلغ سفارش: <strong>{{ order.total_amount|floatformat:0 }} تومان</strong></p>
        <div class="payment-demo-note">
            این صفحه در نسخه فعلی «پرداخت آزمایشی» است و به درگاه بانکی واقعی متصل نیست.
        </div>
        <form method="post" action="{% url 'payment_success' order.id %}">
            {% csrf_token %}
            <button class="product-button" type="submit">تکمیل پرداخت آزمایشی</button>
        </form>
    </div>
</section>
{% endblock %}
